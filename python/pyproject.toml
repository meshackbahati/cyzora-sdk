[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyzora"
version = "1.0.0"
description = "Cyzora M-Pesa payment rail SDK — charges, checkout, payouts, wallets and webhook verification. Standard library only."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["cyzora", "mpesa", "payments", "payouts", "kenya", "mobile-money", "stk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/meshackbahati/cyzora-sdk"

[tool.setuptools]
packages = ["cyzora"]
